<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>What is Bootstrap Layouts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body {
            height: 2000px;
        }
    </style>
</head>
<body>

    <p class="bg-danger text-white bg-gradient p-2">Some Content</p>

    <p class="border border-3 border-primary rounded p-2">Some Content</p>

    <p class="d-none d-md-block">Some Content</p>

    <div class="d-flex flex-column flex-md-row">
        <div class="bg-primary p-5"></div>
        <div class="bg-danger p-5 flex-fill"></div>
        <div class="bg-success p-5"></div>
    </div>
    <br></br>

    <div class="bg-warning p-4 clearfix">
        <h1 class="float-md-start">Some Title</h1>
        <h2 class="float-md-end">Some sub-title</h2>
    </div>
    <br></br>

    <div style="height: 300px" class="bg-dark p-2">
        <div class="h-50 w-50 bg-light"></div>
    </div>

    <h1 class="text-center text-md-start fst-italic">Centered Title</h1>

    <div class="position-relative bg-dark mb-4" style="height: 200px">
        <div class="position-absolute bg-light top-50 start-50 w-25 h-25"></div>
    </div>

    <div class="position-relative bg-dark" style="height: 200px">
        <div class="position-absolute bg-light top-50 start-50 w-25 h-25 translate-middle"></div>
    </div>

    <button class="btn btn-primary position-relative mt-4">
        Goto User List 
        <span class="badge bg-danger">20</span>
    </button>
    <hr>
    <button class="btn btn-primary position-relative">
        Goto User List
        <span class="badge bg-danger position-absolute top-0 start-100 rounded-pill">20</span>
    </button>
    <hr>
    <button class="btn btn-primary position-relative">
        Goto User List
        <span class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-pill">20</span>
    </button><br></br>

    <div class="border p-4 mb-4 bg-light shadow-sm">
        Some Content
    </div>

    <div class="border p-4 mb-4 bg-light shadow">
        Some Content
    </div>

    <div class="border p-4 mb-4 bg-light shadow-lg">
        Some Content
    </div>

</body>
</html>
