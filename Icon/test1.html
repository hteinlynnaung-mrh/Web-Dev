<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>What is Bootstrap Icon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.1/css/all.css">
</head>
<body>

    <i class="fas fa-camera"></i>
    <i class="far fa-user"></i>
    <i class="fab fa-github"></i>

    <ul class="list-group mt-4">
        <li class="list-group-item">
            <i class="far fa-square me-3"></i>
            Something to do
            <i class="fas fa-trash float-end text-danger"></i>
        </li>
        <li class="list-group-item">
            <i class="fas fa-check me-3"></i>
            Another thing to do
            <i class="fas fa-trash float-end text-danger"></i>
        </li>
        <li class="list-group-item">
            <i class="fas fa-check me-3"></i>
            More thing to do
            <i class="fas fa-trash float-end text-danger"></i>
        </li>
    </ul>
    <br></br>

    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a href="#" class="nav-link active">
                <i class="fas fa-list"></i> All Users
            </a>
        </li>
        <li class="nav-item">
            <a href="#" class="nav-link">
                <i class="fas fa-users"></i>New Users
            </a>
        </li>
        <li class="nav-item">
            <a href="#" class="nav-link">
                <i class="fas fa-user"></i>My Profile
            </a>
        </li>
    </ul>
    <br></br>

    <form>
        <div class="mb-2">
            <label><i class="fas fa-user me-2"></i>User Name</label>
            <input type="text" class="form-control">
        </div>
        <div class="mb-2">
            <label><i class="fas fa-envelope me-2"></i>Email</label>
            <input type="text" class="form-control">
        </div>
        <div class="mb-2">
            <label><i class="fas fa-key me-2"></i>Password</label>
            <input type="password" class="form-control">
        </div>

        <button class="btn btn-primary">
            <i class="fas fa-paper-plane me-2"></i>Register
        </button>
    </form>
    <br></br>

    <table class="table table-bordered table-striped">
        <tr>
            <th><i class="fas fa-hashtag"></i>ID</th>
            <th><i class="fas fa-bug"></i>Issue</th>
            <th><i class="fas fa-calendar"></i>Date</th>
            <th><i class="fas fa-sort-amount-down"></i>Level</th>
            <th><i class="fas fa-user"></i>Assign</th>
        </tr>
        <tr>
            <td>1</td>
            <td>A problem with something</td>
            <td>2020-08-11</td>
            <td><span class="badge bg-danger">criticla</span></td>
            <td>Alice</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Another problem with ...</td>
            <td>2020-08-12</td>
            <td><span class="badge bg-warning">important</span></td>
            <td>Bob</td>
        </tr>
    </table>



    

</body>
</html>
